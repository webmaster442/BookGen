<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{Title}}</title>
  <style type="text/css">
    :root {
        --sidebar-width: 250px;
        --sidebar-background-color: #282A36;
        --sidebar-text-color: #F8F8F2;
        --sidebar-link-color: #BD93F9;
        --table-boder-color: #ddd;
        --table-alternate-row-color: #f2f2f2;
        --table-hover-row-color: #ddd;
        --code-color: #c7254e;
    }

    body {
        margin: 0;
        font-family: "Lato", sans-serif;
        font-size: 14pt;
    }

    table {
        border-collapse: collapse;
        width: 100%;
    }

    td, th {
        border: 1px solid var(--table-boder-color);
        padding: 8px;
    }

    tr:nth-child(even){
        background-color: var(--table-alternate-row-color);
    }

    tr:hover {
        background-color: var(--table-hover-row-color);
    }

    code {
        font-family: "Courier New", monospace;
        color: var(--code-color);
    }

    .fixedsidebar {
        height: 100%;
        width: var(--sidebar-width);
        position: fixed;
        z-index: 1;
        top: 0;
        left: 0;
        background-color: var(--sidebar-background-color);
        color: var(--sidebar-text-color);
        overflow-x: hidden;
        padding-top: 20px;
    }

    .fixedsidebar a {
        color: var(--sidebar-link-color);
        text-decoration: none;
    }

    .fixedsidebar a:hover {
        text-decoration: underline;
    }

    .main-article {
        margin-left: var(--sidebar-width);
        padding: 20px;
        max-width: 1000px;
    }

    .hidden {
        display: none;
    }
  </style>

  <style type="text/css">
    {{PrismCss}}
  </style>

</head>

<body>
    <main>
        <aside>
            <nav id="articleNav" class="fixedsidebar">
                <H1>Articles</H1>
                {{Navigation}}
                <h2>Chapters</h2>
                <div id="chapterNav">
                    <!-- Chapters will be dynamically generated here -->
                </div>
            </nav>
        </aside>

        <article class="main-article" id="currentArticle">
            {{Index}}
        </article>
    </main>

    <aside class="hidden" id="articleStore">
        {{Content}}
    </aside>

    <script type="text/javascript">
        function onLoaded() {
            var id = window.location.hash.substring(1);
            if (!id) {
                return;
            }

            if (!/^a\d/.test(id)) {
                return;
            }

            var currentArticle = document.getElementById('currentArticle');
            var articleStore = document.getElementById('articleStore');
            var source = articleStore ? articleStore.querySelector('#' + id) : null;

            if (source) {
                currentArticle.innerHTML = source.innerHTML;
                GenerateChapterNavigation();
            } 
            else {
                const p = document.createElement("p");
                p.style.color = "red";
                p.textContent = `The given id '${id}' is not found.`;
                currentArticle.replaceChildren(p);
            }
        }

        function GenerateChapterNavigation() {
                var toc = "";
                var level = 0;
                const contentDiv = "currentArticle";
                const targetDiv = "chapterNav";

                document.getElementById(contentDiv).innerHTML
                    = document.getElementById(contentDiv).innerHTML.replace(
                        /<h([\d]).*>([^<]+)<\/h([\d])>/gi,
                        function (str, openLevel, titleText, closeLevel) {
                            if (openLevel !== closeLevel) {
                                return str;
                            }
                            
                            if (openLevel > level) {
                                toc += (new Array(openLevel - level + 1)).join("<ul>");
                            } else if (openLevel < level) {
                                toc += (new Array(level - openLevel + 1)).join("</ul>");
                            }
                            
                            level = parseInt(openLevel);
                            
                            var anchor = titleText.replace(/ /g, "_");
                            toc += "<li><a href=\"#" + anchor + "\">" + titleText + "</a></li>";
                            
                            return "<h" + openLevel + "><a name=\"" + anchor + "\">" + titleText + "</a></h" + closeLevel + ">";
                        });
            if (level) {
                toc += (new Array(level + 1)).join("</ul>");
            }

            document.getElementById(targetDiv).innerHTML = toc;
        }

        window.addEventListener('load', onLoaded);
        window.addEventListener('hashchange', onLoaded);
    </script>

</body>

</html>
